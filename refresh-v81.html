<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abriendo DT Manager Pro v12 (23 Jornadas)...</title>
  <script>
    (async function(){
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) await r.unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) await caches.delete(k);
        }
      } catch (_) {}
      location.replace('./index.html?v=12&nocache=' + Date.now());
    })();
  </script>
</head>
<body style="background:#030b07;color:#22e07a;font-family:sans-serif;display:grid;place-items:center;min-height:100vh">

</body>
