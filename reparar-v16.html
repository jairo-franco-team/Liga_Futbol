<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verificador y Reparador de Escudo v16 · Atlético La Luz</title>
  <style>
    body { background:#020906; color:#f4fbf7; font-family:system-ui,sans-serif; display:grid; place-items:center; min-height:100vh; margin:0; padding:20px; text-align:center; }
    .card { max-width:420px; width:100%; background:#071d13; border:2px solid #1ee87a; border-radius:24px; padding:26px; box-shadow:0 20px 50px rgba(0,0,0,0.7); }
    .crest-preview { width:136px; height:136px; margin:16px auto; border-radius:24px; border:3px solid #f7c948; padding:6px; background:#050806; display:none; place-items:center; }
    .crest-preview img { width:100%; height:100%; object-fit:contain; border-radius:16px; }
    .btn { display:inline-block; margin-top:14px; padding:12px 20px; border-radius:12px; background:#1ee87a; color:#021d0f; font-weight:800; text-decoration:none; border:0; cursor:pointer; font-size:14px; width:100%; }
    .btn-sec { background:rgba(247,201,72,0.18); color:#fef08a; border:1px solid #f7c948; margin-top:10px; }
  </style>
</head>
<body>
  <div class="card">
    <div style="color:#5bf59e;font-size:11px;font-weight:800;letter-spacing:0.1em">REPARADOR OFICIAL V16</div>
    <h2 id="stTitle" style="margin:8px 0;font-size:20px">Sincronizando escudo nuevo con GitHub Pages...</h2>
    <p id="stMsg" style="color:#9abaa9;font-size:13.5px">Limpiando memoria caché de Chrome y esperando publicación (tarda ~45-60 seg tras guardar)...</p>
    <div id="previewBox" class="crest-preview"><img id="previewImg" alt="Escudo Reparado" /></div>
    <a id="goBtn" class="btn" href="./index.html?v=16" style="display:none">✅ Entrar a DT Manager Pro (Escudo Listo)</a>
    <label class="btn btn-sec" style="display:block;box-sizing:border-box">
      📷 O subir imagen directo desde tu galería
      <input id="manualFile" type="file" accept="image/*" style="display:none" />
    </label>
  </div>
  <script>
    async function clearAllCaches() {
      try {
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const k = localStorage.key(i);
          const v = localStorage.getItem(k);
          if (v && v.indexOf('data:image/webp') !== -1) localStorage.removeItem(k);
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) await r.unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) await caches.delete(k);
        }
      } catch (_) {}
    }

    async function pollNewCrest() {
      await clearAllCaches();
      const url = './assets/escudo-luz-clean-v16.js?t=' + Date.now();
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (res.ok) {
          const code = await res.text();
          const sc = document.createElement('script');
          sc.textContent = code;
          document.head.appendChild(sc);
          if (window.ATLETICO_LA_LUZ_REAL_LOGO) {
            document.getElementById('stTitle').textContent = '¡Escudo de Atlético La Luz Reparado!';
            document.getElementById('stMsg').textContent = 'Aquí tienes la vista previa limpia. Redirigiendo a tu app...';
            document.getElementById('previewImg').src = window.ATLETICO_LA_LUZ_REAL_LOGO;
            document.getElementById('previewBox').style.display = 'grid';
            const go = document.getElementById('goBtn');
            go.href = './index.html?v=16_' + Date.now();
            go.style.display = 'inline-block';
            await fetch('./index.html', { cache: 'reload' }).catch(() => {});
            setTimeout(() => location.replace(go.href), 1800);
            return;
          }
        }
      } catch (_) {}
      setTimeout(pollNewCrest, 3500);
    }

    document.getElementById('manualFile').addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        const dataUrl = String(r.result || '');
        localStorage.setItem('CUSTOM_LUZ_CREST_OVERRIDE', dataUrl);
        document.getElementById('previewImg').src = dataUrl;
        document.getElementById('previewBox').style.display = 'grid';
        document.getElementById('stTitle').textContent = '¡Escudo cargado desde tu galería!';
        setTimeout(() => location.replace('./index.html?v=16_' + Date.now()), 900);
      };
      r.readAsDataURL(f);
    });

    pollNewCrest();
  </script>
</body>
</html>
